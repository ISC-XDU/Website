# ====================================================================
# 西电浪潮俱乐部新站（xdu-inspur.cn）Nginx 配置
#
# 部署位置：/etc/nginx/sites-enabled-2026/xdu-inspur-2026.conf
# 服务器 root：/home/isc_web/xdu-inspur-2026
# 部署方式：GitHub Actions（IS 仓库 AutoDeploy.yml）把 dist/ 同步到此 root
# 证书：Let's Encrypt /etc/letsencrypt/live/xdu-inspur.cn/
# ====================================================================

# 80 段：HTTP 重定向到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name xdu-inspur.cn www.xdu-inspur.cn;
    return 301 https://$host$request_uri;
}

# 443 段：HTTPS 主体
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name xdu-inspur.cn www.xdu-inspur.cn;

    ssl_certificate /etc/letsencrypt/live/xdu-inspur.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xdu-inspur.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;

    root /home/isc_web/xdu-inspur-2026;
    index index.html index.htm;

    # Astro build.format: 'directory' 生成的产物是 /xxx/index.html 形式
    # 必须带 $uri/index.html，否则子页（/members/、/tech/ 等）会 404
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # 静态资源缓存（GSAP / 头像 / 海报 / 字体）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 安全：禁止访问 . 开头的隐藏文件（如 .git、.env）
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 元数据：robots.txt 不记录访问日志
    location = /robots.txt {
        access_log off;
    }

    access_log /var/log/nginx/xdu-inspur.access.log;
    error_log  /var/log/nginx/xdu-inspur.error.log;
}


# ====================================================================
# 重要：80 + 443 必须合并到同一个 conf 文件里（不要拆成两个）
# ====================================================================
# 历史教训：早期把 80 段放在 xdu-inspur-2026.conf，443 段留在旧站
# isc_website 文件里，nginx 实际响应 443 时按"先 listen 先匹配"规则
# 命中 isc_website 的 443 段（root 旧站），结果整个 https 站点都 serve
# 旧内容、看不到新 favicon / 新增的 HTML。
#
# 整合后：80 段负责 HTTP→HTTPS 重定向，443 段才是真正 serve 新站
# 的主体——必须**同一个 conf 文件**才不会被其它 server block 抢走。
# ====================================================================


# ====================================================================
# 博客独立部署建议（blog.xdu-inspur.cn 子域名）
# ====================================================================
# 博客是独立 GitHub 仓库 + 独立目录（不在新站 dist 里），推荐走
# 独立子域名而不是用 alias 挂到主域名下：
#
#   1) DNS 加 A 记录：blog.xdu-inspur.cn → <服务器 IP>
#   2) Let's Encrypt 证书扩展（包含主域 + 子域）：
#        sudo certbot certonly --nginx --expand \
#          -d xdu-inspur.cn -d blog.xdu-inspur.cn
#   3) 新增 server block（指向博客独立目录）：
#
#      server {
#          listen 443 ssl;
#          listen [::]:443 ssl;
#          server_name blog.xdu-inspur.cn;
#
#          ssl_certificate /etc/letsencrypt/live/xdu-inspur.cn/fullchain.pem;
#          ssl_certificate_key /etc/letsencrypt/live/xdu-inspur.cn/privkey.pem;
#          ssl_protocols TLSv1.2 TLSv1.3;
#          ssl_prefer_server_ciphers on;
#
#          root /home/isc_web/xdu_isc_blog;     # 博客独立目录
#          index index.html index.htm;
#
#          location / { try_files $uri $uri/ $uri/index.html =404; }
#          # 同样配静态资源 / 隐藏文件 deny / robots.txt
#      }
#
# 不要用 alias 把博客挂到主域名子路径下（如 /xdu_isc_blog/site/），
# 那会让两个独立项目的部署耦合，新站 conf 改 root 时容易误伤博客。
# ====================================================================


# ====================================================================
# ACME / Let's Encrypt 验证文件位置
# ====================================================================
# SSL 续签时 Let's Encrypt 会请求 /.well-known/acme-challenge/XXX
# 验证文件必须能通过当前站点 root serve 出来。本项目把验证文件放
# 在 /home/isc_web/xdu-inspur-2026/.well-known/pki-validation/
# （public/.well-known/pki-validation/fileauth.txt，build 时随 dist
# 同步到 server root）。
#
# 如果 ACME 验证失败（403/404），需要：
#   1) 确认文件存在于 <root>/.well-known/acme-challenge/
#   2) 确认 nginx 配里没有 deny 这个路径
#   3) 当前 location ~ /\. 块会 deny 所有 . 开头文件——验证前临时
#      注释掉、或单独 allow 这一条路径
# ====================================================================


# ====================================================================
# GitHub Actions 配套
# ====================================================================
# repo: ISC-XDU/Website
# workflow: .github/workflows/AutoDeploy.yml
# 必备 Secrets：
#   ISC_SERVER_PRIVATE_KEY  SSH 私钥（OpenSSH 格式）
#   ISC_SERVER_HOST_ADDRESS 服务器 IP 或域名
#   ISC_SERVER_USER         SSH 用户名（如 root）
#   WORK_TARGEAT_PATH       rsync 目标路径（如 /home/isc_web/xdu-inspur-2026）
# workflow 用 easingthemes/ssh-deploy@main 同步 dist/，rsync ARGS 加
# --delete 确保 server 端不残留旧文件。
# ====================================================================

name: auto_deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # 手动触发

jobs:
  deploy:
    # 跟旧站同名的 job —— PR 上也跑（仅 build 不部署），main 上才完整 deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # 只在 main 分支上做部署（PR 不会触发，避免生产 Secret 泄漏）
      - name: Deploy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ISC_SERVER_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.ISC_SERVER_HOST_ADDRESS }}
          REMOTE_USER: ${{ secrets.ISC_SERVER_USER }}
          TARGET: ${{ secrets.WORK_TARGEAT_PATH }}
          SOURCE: 'dist/'
          ARGS: '-rltgoDzvO --delete'
